<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ff4b72" />
      <stop offset="50%" stop-color="#e11d48" />
      <stop offset="100%" stop-color="#881337" />
    </linearGradient>
    <linearGradient id="heartGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.95" />
      <stop offset="100%" stop-color="#ffe4e6" stop-opacity="0.8" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="16" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  
  <!-- App Background with rounded squircle -->
  <rect width="512" height="512" rx="128" fill="url(#bgGrad)" />
  
  <!-- Subtle inner ambient circles -->
  <circle cx="160" cy="160" r="140" fill="#ffffff" fill-opacity="0.08" />
  <circle cx="360" cy="360" r="120" fill="#000000" fill-opacity="0.15" />
  
  <!-- Intertwined Couple Hearts -->
  <g transform="translate(256, 256) scale(1.15)" filter="url(#glow)">
    <!-- Primary Heart -->
    <path d="M0 -30 
             C -20 -80, -90 -80, -110 -30 
             C -130 20, -70 80, 0 140 
             C 70 80, 130 20, 110 -30 
             C 90 -80, 20 -80, 0 -30 Z" 
          fill="url(#heartGrad)" />
    
    <!-- Secondary Offset Floating Mini Heart -->
    <path d="M 60 -70 
             C 50 -100, 10 -100, 0 -70 
             C -10 -40, 25 0, 60 30 
             C 95 0, 130 -40, 120 -70 
             C 110 -100, 70 -100, 60 -70 Z" 
          fill="#ffd1dc" 
          fill-opacity="0.9" />
          
    <!-- Sparkles -->
    <path d="M -80 -90 Q -80 -70 -100 -70 Q -80 -70 -80 -50 Q -80 -70 -60 -70 Q -80 -70 -80 -90 Z" fill="#ffffff" opacity="0.9" />
    <path d="M 100 60 Q 100 75 85 75 Q 100 75 100 90 Q 100 75 115 75 Q 100 75 100 60 Z" fill="#ffffff" opacity="0.85" />
    <circle cx="-30" cy="-65" r="4" fill="#ffffff" opacity="0.9" />
    <circle cx="50" cy="85" r="3" fill="#ffffff" opacity="0.8" />
  </g>
  
  <!-- Elegant "Us" Monogram text at bottom -->
  <text x="256" y="445" 
        font-family="'Playfair Display', Georgia, serif" 
        font-size="44" 
        font-style="italic" 
        font-weight="700" 
        fill="#ffffff" 
        opacity="0.9" 
        text-anchor="middle" 
        letter-spacing="4">US · FOREVER</text>
</svg>
